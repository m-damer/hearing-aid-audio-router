name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK (every push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: audio-router-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="hearing-aid-audio-router-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release was created from the GitHub website: just attach the APK to it.
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "موجّه الصوت $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
